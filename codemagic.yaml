# Codemagic CI 配置 —— 未签名 ipa 专用
#
# 前提：没有 Apple 开发者证书。产出的是「未签名 ipa」，
#       后续在 Windows 上用 Sideloadly / AltStore 自己签名安装。
#
# 使用步骤：
#   1. https://codemagic.io 用 GitHub 登录
#   2. Add application -> 选 ZCM111111/maimai-stabilizer
#   3. 构建类型选 "iOS App Store"（或 "Other"），Codemagic 自动读本文件
#   4. 什么都不用配（不需要证书、不需要 Apple ID、不需要 App Store Connect Key）
#   5. Start new build -> 进去看实时完整日志
#   6. 构建完成后在 Artifacts 里下载 ipa
#
# 注意：Codemagic 免费额度（500 min/月）主要覆盖 Linux 机器。
#       iOS 构建必须用 macOS 机器（mac_mini_m2）。如果网页提示需要付费，
#       说明 macOS 分钟不在免费额度内 —— 那就回 GitHub Actions（公开仓库免费）。
#       Codemagic 的额外价值是「日志能在网页上实时看着读」，排查方便。

workflows:
  ios-unsigned:
    name: iOS 未签名构建
    max_build_duration: 40
    instance_type: mac_mini_m2

    environment:
      # 钉在 16.4：这个版本的 Metal 编译器是自带的。
      # 别用 latest —— Xcode 26 把 Metal Toolchain 拆成了独立可选组件，
      # 默认不装，会出现：
      #   error: cannot execute tool 'metal' due to missing Metal Toolchain
      # 如果这台机器上没有 16.4，Codemagic 会直接报「Xcode version not available」，
      # 那就改成 latest，靠下面「确保 Metal 编译器存在」那一步兜底。
      xcode: 16.4
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: 环境信息
        script: |
          xcodebuild -version
          sw_vers
          echo "--- repo ---"
          ls -la
          echo "--- 可用 Xcode ---"
          ls /Applications | grep -i xcode || true

      # Xcode 26+ 才需要；16.x 自带 Metal 工具链，这步会打印 ineligible 然后跳过。
      - name: 确保 Metal 编译器存在
        script: |
          set +e
          echo "--- 尝试下载 MetalToolchain 组件 ---"
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20
          echo "下载步骤返回码 = $?（16.x 上提示 ineligible 属正常，可忽略）"
          echo "--- 检查 metal 工具 ---"
          xcrun -f metal 2>&1 || echo "没找到 metal 工具"
          xcrun -f metallib 2>&1 || echo "没找到 metallib"
          exit 0

      - name: 列出 scheme 与配置
        script: |
          xcodebuild -project FisheyeGimbal.xcodeproj -list

      - name: 编译（完全不签名）
        script: |
          set -e
          xcodebuild \
            -project FisheyeGimbal.xcodeproj \
            -scheme FisheyeGimbal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            clean build

      - name: 打包未签名 ipa
        script: |
          set -e
          APP=$(find build/Build/Products -name "FisheyeGimbal.app" -maxdepth 4 | head -1)
          echo "APP = $APP"
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr FisheyeGimbal-unsigned.ipa Payload
          cd ..
          ls -lh out/FisheyeGimbal-unsigned.ipa
          shasum -a 256 out/FisheyeGimbal-unsigned.ipa

    artifacts:
      - out/*.ipa
      - build/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - your@email.com        # 改成你自己的邮箱，用来收构建结果
        notify:
          success: true
          failure: true
