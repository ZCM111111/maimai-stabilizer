name: build-ios

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon runner，装的是 Xcode 15.x
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          echo "--- repo ---"
          ls -la

      - name: 解析 Xcode 版本号
        id: xc
        run: |
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Xcode = $V"

      - name: 列出 scheme 与配置
        run: |
          xcodebuild -project FisheyeGimbal.xcodeproj -list

      # 关键：不加重定向、加 -quiet。
      # -quiet 会把几千行正常编译输出压掉，只留警告和错误，
      # 于是编译失败时错误行必然出现在这一步的公开 step log 里。
      # tee 只是为了同时留一份给 artifact。
      - name: 编译（不签名，产 .app）
        id: build
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project FisheyeGimbal.xcodeproj \
            -scheme FisheyeGimbal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ steps.xc.outputs.version }} \
            clean build 2>&1 | tee xcodebuild.log
          RC=${PIPESTATUS[0]}
          echo "::notice::xcodebuild 退出码 = $RC"
          echo "RC=$RC" >> $GITHUB_OUTPUT
          exit $RC

      - name: 结果概要
        if: always()
        run: |
          echo "commit = ${{ github.sha }}"
          echo "build RC = ${{ steps.build.outputs.RC }}"
          echo "=== BUILD 标记 ==="
          grep -cE '.' xcodebuild.log || true
          echo "=== error 行 ==="
          grep -nE 'error:|fatal error:' xcodebuild.log || echo "(无 error 行)"
          echo "=== 末尾 30 行 ==="
          tail -30 xcodebuild.log

      - name: 打包成 Payload/FisheyeGimbal.ipa
        if: steps.build.outputs.RC == '0'
        run: |
          set -e
          APP=$(find build/Build/Products -name "FisheyeGimbal.app" -maxdepth 4 | head -1)
          echo "APP = $APP"
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr FisheyeGimbal-unsigned.ipa Payload
          ls -lh FisheyeGimbal-unsigned.ipa
          shasum -a 256 FisheyeGimbal-unsigned.ipa

      - name: 上传 ipa
        if: steps.build.outputs.RC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FisheyeGimbal-unsigned-ipa
          path: out/FisheyeGimbal-unsigned.ipa
          if-no-files-found: error

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
