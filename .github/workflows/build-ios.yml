name: build-ios

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon runner，装的是 Xcode 15.x
    # 注意：私有仓库的 macOS runner 是 10 倍计费倍率；公开仓库 Actions 免费。
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          ls -la

      - name: 解析 Xcode 版本号
        id: xc
        run: |
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Xcode = $V"

      - name: 列出 scheme 与配置
        run: |
          xcodebuild -project FisheyeGimbal.xcodeproj -list

      - name: 编译（不签名，产 .app）
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project FisheyeGimbal.xcodeproj \
            -scheme FisheyeGimbal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ steps.xc.outputs.version }} \
            clean build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit = $RC"
          echo "RC=$RC" >> $GITHUB_OUTPUT
          tail -20 xcodebuild.log
          exit $RC

      - name: 打包成 Payload/FisheyeGimbal.ipa
        if: steps.build.outputs.RC == '0'
        run: |
          set -e
          APP=$(find build/Build/Products -name "FisheyeGimbal.app" -maxdepth 4 | head -1)
          echo "APP = $APP"
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr FisheyeGimbal-unsigned.ipa Payload
          ls -lh FisheyeGimbal-unsigned.ipa
          shasum -a 256 FisheyeGimbal-unsigned.ipa

      - name: 上传 ipa
        if: steps.build.outputs.RC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FisheyeGimbal-unsigned-ipa
          path: out/FisheyeGimbal-unsigned.ipa
          if-no-files-found: error

      # 把完整日志推到孤儿分支 build-log，这样用 raw.githubusercontent.com
      # 就能直接读到全文（不需要认证、不消耗 API 配额）。
      # 远程排查完可以随时删掉这个分支。
      - name: 把完整日志推到 build-log 分支
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          wc -c xcodebuild.log
          mkdir -p /tmp/logpub
          cp xcodebuild.log /tmp/logpub/xcodebuild.log
          cat > /tmp/logpub/meta.txt <<EOF
          sha=${{ github.sha }}
          run=${{ github.run_id }}
          build_RC=${{ steps.build.outputs.RC }}
          xcode_version=${{ steps.xc.outputs.version }}
          EOF
          cd /tmp/logpub
          git init -q -b build-log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build log for ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            build-log:build-log || echo "推送日志分支失败（不影响构建结论）"
