name: build-ios

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon runner，装的是 Xcode 15.x
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          echo "--- 仓库内容 ---"
          ls -la

      - name: 解析 Xcode 版本号
        id: xc
        run: |
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Xcode = $V"

      - name: 列出 scheme（先确认 scheme 能被识别）
        run: |
          xcodebuild -project FisheyeGimbal.xcodeproj -list || true

      - name: 编译（不签名，产 .app）
        id: build
        # 关键：不用 pipefail，失败也要继续，好让下一个步骤打日志
        run: |
          xcodebuild \
            -project FisheyeGimbal.xcodeproj \
            -scheme FisheyeGimbal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ steps.xc.outputs.version }} \
            clean build > xcodebuild.log 2>&1
          echo "RC=$?" >> $GITHUB_OUTPUT
          tail -5 xcodebuild.log

      # ---- 诊断步骤：无条件执行，把编译问题直接打到这里 ----
      - name: 诊断 xcodebuild.log
        if: always()
        run: |
          echo "=================== 构建结果标记 ==================="
          grep -nE "^\*\* BUILD|^BUILD|Testing failed|The following build commands failed" xcodebuild.log | tail -20 || echo "(无 BUILD 标记)"
          echo ""
          echo "=================== error: 行 ==================="
          grep -nE "error:|error :|fatal error:" xcodebuild.log | head -100 || echo "(没有 error: 行)"
          echo ""
          echo "=================== 项目/scheme 相关 ==================="
          grep -niE "cannot be opened|damaged|unsupported|does not contain a scheme|scheme .* not found|missing the following|is not a valid|would you like" xcodebuild.log | head -40 || echo "(无)"
          echo ""
          echo "=================== 尾部 60 行 ==================="
          tail -60 xcodebuild.log

      - name: 打包成 Payload/FisheyeGimbal.ipa
        if: steps.build.outputs.RC == '0'
        run: |
          set -e
          APP=$(find build/Build/Products -name "FisheyeGimbal.app" -maxdepth 4 | head -1)
          echo "APP = $APP"
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr FisheyeGimbal-unsigned.ipa Payload
          ls -lh FisheyeGimbal-unsigned.ipa
          shasum -a 256 FisheyeGimbal-unsigned.ipa

      - name: 上传 ipa
        if: steps.build.outputs.RC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FisheyeGimbal-unsigned-ipa
          path: out/FisheyeGimbal-unsigned.ipa
          if-no-files-found: error

      - name: 失败则让 job 失败
        if: steps.build.outputs.RC != '0'
        run: |
          echo "编译失败，RC=${{ steps.build.outputs.RC }}，看上面『诊断 xcodebuild.log』那一段"
          exit 1
