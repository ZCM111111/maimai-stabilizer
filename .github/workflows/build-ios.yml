name: build-ios

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon runner，装的是 Xcode 15.x
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          ls -la

      - name: 解析 Xcode 版本号
        id: xc
        run: |
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Xcode = $V"

      - name: 列出 scheme
        run: |
          xcodebuild -project FisheyeGimbal.xcodeproj -list || true

      - name: 编译（不签名，产 .app）
        id: build
        run: |
          xcodebuild \
            -project FisheyeGimbal.xcodeproj \
            -scheme FisheyeGimbal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ steps.xc.outputs.version }} \
            clean build > xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit = $RC"
          echo "RC=$RC" >> $GITHUB_OUTPUT
          exit $RC

      # 把编译问题做成 annotation：annotation 接口公开可读，方便远程排查
      - name: 诊断（转成 annotation）
        if: always()
        run: |
          echo "=============== BUILD 结果 ==============="
          grep -nE '^\*\* BUILD|Testing failed|The following build commands failed' xcodebuild.log | tail -10 || true
          echo "=============== error 行 ==============="
          grep -nE 'error:|fatal error:' xcodebuild.log | head -50 | tr -d '\r' | tr -cd '\11\12\15\40-\176' | while IFS= read -r l; do echo "::error::DIAG|$l"; done || true
          echo "=============== 项目/scheme ==============="
          grep -niE 'cannot be opened|damaged|unsupported|does not contain a scheme|missing the following|is not a valid' xcodebuild.log | head -20 | tr -d '\r' | tr -cd '\11\12\15\40-\176' | while IFS= read -r l; do echo "::error::DIAG|$l"; done || true
          echo "=============== tail 40 ==============="
          tail -40 xcodebuild.log | tr -d '\r' | tr -cd '\11\12\15\40-\176' | while IFS= read -r l; do echo "::warning::TAIL|$l"; done || true

      - name: 打包成 Payload/FisheyeGimbal.ipa
        if: steps.build.outputs.RC == '0'
        run: |
          set -e
          APP=$(find build/Build/Products -name "FisheyeGimbal.app" -maxdepth 4 | head -1)
          echo "APP = $APP"
          test -n "$APP" || { echo "找不到 .app"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qr FisheyeGimbal-unsigned.ipa Payload
          ls -lh FisheyeGimbal-unsigned.ipa
          shasum -a 256 FisheyeGimbal-unsigned.ipa

      - name: 上传 ipa
        if: steps.build.outputs.RC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FisheyeGimbal-unsigned-ipa
          path: out/FisheyeGimbal-unsigned.ipa
          if-no-files-found: error

      # 始终上传完整日志：即使前面的诊断步骤没显出问题，日志本身也留着
      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
